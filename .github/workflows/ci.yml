name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake

      - name: Lint
        run: pnpm eslint . --max-warnings 0

      - name: Test
        run: pnpm test

      # Gate the build too: a clinical app must not be able to ship a broken
      # build. Hermetic — verified next build compiles with no DB reachable
      # (the sitemap does no DB reads); placeholder URL satisfies drizzle config.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake
