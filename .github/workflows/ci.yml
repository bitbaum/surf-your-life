name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Next keeps its compiler output in .next/cache. Without restoring it,
      # every CI run recompiles the whole app from scratch — and the deploy
      # then compiles it a second time. Measured across the fleet on
      # 2026-09-07: of eight repos, exactly one cached this.
      #
      # Keyed on the lockfile so a dependency change invalidates it. The bare
      # restore-key is last on purpose: a stale cache still beats no cache,
      # and Next validates its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single SSOT check bundle (typecheck + lint + test) — defined in package.json.
      - name: Verify
        run: pnpm verify
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake

      # Gate the build too: a clinical app must not be able to ship a broken
      # build. Hermetic — verified next build compiles with no DB reachable
      # (the sitemap does no DB reads); placeholder URL satisfies drizzle config.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake
