name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single SSOT check bundle (typecheck + lint + test) — defined in package.json.
      - name: Verify
        run: pnpm verify
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake

      # Build is hermetic (compiles with no DB reachable) — gate it to catch build breaks.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake
