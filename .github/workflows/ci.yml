name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single SSOT check bundle (typecheck + lint + test) — defined in package.json.
      - name: Verify
        run: pnpm verify
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake

      # Gate the build too: a clinical app must not be able to ship a broken
      # build. Hermetic — verified next build compiles with no DB reachable
      # (the sitemap does no DB reads); placeholder URL satisfies drizzle config.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake
