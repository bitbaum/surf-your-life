name: Browser smoke

# Every way into a Surf Your Life account, in a real Chromium against the
# production standalone server and a throwaway PostgreSQL built from the
# committed migrations plus the cutover import (scripts/browser-smoke.mjs):
# the method set on /login, /register and /forgot-password at 320px and 390px;
# sign up, sign out, a wrong password refused, sign in; an account imported
# from Auth.js (bcrypt, seeded before the import) signing in with its old
# password and role; a password reset through the mailed link; an email
# sign-in link; and the passkey and two-factor settings. Mail is AccountKit's
# real mail, caught by scripts/ci/mail-sink.cjs instead of being sent. No
# GOOGLE_* pair is set, and no Google-only button may appear. Synthetic people
# only; the OrangeCat and bitbaum sign-in client values below exist only so
# their buttons render, and are never used to sign in.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  account:
    name: account (AccountKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: surf_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d surf_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/surf_smoke
      AUTH_SECRET: synthetic-browser-smoke-secret-at-least-32-chars
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
      NEXT_TELEMETRY_DISABLED: "1"
      LEGACY_EMAIL: legacy-smoke@example.test
      LEGACY_PASSWORD: synthetic legacy smoke password
      # Outside the uploaded artifacts: it holds (synthetic) reset tokens.
      MAIL_SINK: /tmp/surf-ci-mail.jsonl
      RESEND_API_KEY: re_ci_sink_only
      RESEND_FROM: Surf Your Life <hello@surf-your-life.orangecat.ch>
      ORANGECAT_OAUTH_CLIENT_ID: surf-ci
      ORANGECAT_OAUTH_CLIENT_SECRET: ci-only
      SIGNIN_ISSUER: https://morulia.orangecat.ch
      SIGNIN_CLIENT_ID: surf-ci
      SIGNIN_CLIENT_SECRET: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrations replay to the Drizzle schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE surf_pushed"
          scripts/db/check-migration-drift.sh "$DATABASE_URL" "${DATABASE_URL%/*}/surf_pushed"

      # The rehearsal must pass on the chain, then the real-database journeys
      # (they leave the tables empty), then one Auth.js-era account and the
      # import, for the browser journey.
      - name: AccountKit import and journeys on the chain
        env:
          SURF_JOURNEY_DATABASE_URL: postgres://app:app@127.0.0.1:5432/surf_smoke
        run: |
          pnpm run db:rehearse-import
          pnpm exec vitest run lib/auth/shared
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -X -c "TRUNCATE users, auth_users CASCADE"
          node scripts/ci/seed-legacy-account.mjs
          pnpm run db:rehearse-import
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -X -1 -f scripts/db/accountkit-import.sql

      - run: pnpm build
      - name: Assemble the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Account journey
        run: |
          (cd .next/standalone && NODE_OPTIONS="--require $GITHUB_WORKSPACE/scripts/ci/mail-sink.cjs" PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/de/login && break; sleep 1; done
          pnpm run smoke:browser

      - name: Keep screenshots and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surf-browser-smoke
          path: |
            browser-smoke-artifacts/
            server.log
          retention-days: 14
          if-no-files-found: warn
