allowBuilds:
  # Git-hosted, so pnpm runs its `prepare` script to build dist/ on install.
  # pnpm requires the exact resolved tarball here, not the bare name — bump
  # this SHA together with the #vX.Y.Z tag in package.json.
  "@fleet/ai-forms@https://codeload.github.com/bitbaum/ai-forms/tar.gz/68087895ab9d46d73d03b91ebf5e648b969ebd76": true
  # The app itself now uses @bitbaum/ai-kit from npm (prebuilt, no build step).
  # This entry covers the NESTED git ai-kit that @fleet/ai-forms still pins as
  # its own dependency — it goes away when ai-forms moves to npm too.
  "ai-kit@https://codeload.github.com/bitbaum/ai-kit/tar.gz/ace11f14d817079ae2bf4cdc010b6daa9faacbec": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Packages published by us, exempted from the minimum-release-age supply-chain
# window. The window exists to keep a freshly COMPROMISED third-party release
# out; a package we published minutes earlier from our own OIDC trusted
# publisher is not what it guards against.
#
# ai-kit is pinned to the exact version on purpose: a bare name exempts every
# FUTURE version too, which quietly disables the gate for that package forever.
# (@bitbaum/mail-kit is bare above — worth tightening the same way, separately,
# rather than editing another PR's line here.)
minimumReleaseAgeExclude:
  - "@bitbaum/mail-kit"
  - "@bitbaum/ai-kit@0.7.0"
